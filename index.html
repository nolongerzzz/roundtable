<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roundtable</title>
<style>
  :root {
    --bg: #eceae3;
    --bg-panel: #f6f4ee;
    --bg-pane: #f1efe8;
    --ink: #1c1b19;
    --ink-dim: #6b6862;
    --line: #d8d4c8;
    --line-strong: #b8b3a4;
    --accent: #b8532f;
    --danger: #a13f3f;
    --good: #4a7a4a;
    --you-bg: #dcd8cb;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613; --bg-panel: #201f1b; --bg-pane: #1c1b17; --ink: #eae7df; --ink-dim: #948f83;
      --line: #38352e; --line-strong: #4a4639; --accent: #d97a4e; --danger: #d9716a; --good: #7aab7a;
      --you-bg: #2c2a24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613; --bg-panel: #201f1b; --bg-pane: #1c1b17; --ink: #eae7df; --ink-dim: #948f83;
    --line: #38352e; --line-strong: #4a4639; --accent: #d97a4e; --danger: #d9716a; --good: #7aab7a;
    --you-bg: #2c2a24;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .subtitle {
    font-size: 11.5px; color: var(--ink-dim); font-family: var(--mono);
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .dot.synced { background: var(--good); }
  .dot.error { background: var(--danger); }
  .dot.busy { background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  button {
    font-family: var(--sans); font-size: 13px;
    border: 1px solid var(--line-strong); background: var(--bg-panel); color: var(--ink);
    padding: 7px 12px; border-radius: var(--radius); cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  button:hover { border-color: var(--ink-dim); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff8f2; font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); }
  button.icon { padding: 7px 9px; font-family: var(--mono); }
  button:disabled { opacity: 0.4; cursor: default; }

  .board {
    flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
  }
  .lane {
    flex: 1 1 340px; min-width: 300px;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    scroll-snap-align: start;
    background: var(--bg-pane);
  }
  .lane:last-child { border-right: none; }

  .lane-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    background: var(--bg-panel);
  }
  .lane-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lane-color); flex-shrink: 0; }
  .lane-name {
    font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--lane-color);
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lane-remove { font-size: 11px; color: var(--ink-dim); }
  .lane-remove:hover { color: var(--danger); }

  .lane-messages { flex: 1; overflow-y: auto; padding: 14px; }
  .lane-empty { color: var(--ink-dim); font-size: 12.5px; text-align: center; padding: 30px 10px; line-height: 1.6; }

  .bubble-row { display: flex; margin-bottom: 12px; }
  .bubble-row.you { justify-content: flex-end; }
  .bubble-row.agent { justify-content: flex-start; }
  .bubble {
    max-width: 88%; padding: 8px 11px; border-radius: 10px;
    font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    position: relative;
  }
  .bubble-row.you .bubble { background: var(--you-bg); border-top-right-radius: 3px; }
  .bubble-row.agent .bubble { background: var(--bg-panel); border: 1px solid var(--lane-color); border-top-left-radius: 3px; }
  .bubble-meta {
    display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    font-family: var(--mono); font-size: 10px; color: var(--ink-dim);
  }
  .bubble-row.you .bubble-meta { justify-content: flex-end; }
  .bubble-actions {
    display: flex; gap: 4px; margin-top: 5px; opacity: 0; transition: opacity 0.12s ease;
  }
  .bubble-row:hover .bubble-actions { opacity: 1; }
  .bubble-action {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .bubble-action:hover { color: var(--accent); }

  .lane-composer {
    border-top: 1px solid var(--line); padding: 10px 14px 12px;
    flex-shrink: 0; background: var(--bg-panel);
  }
  .toggle-row { display: flex; gap: 6px; margin-bottom: 7px; }
  .toggle {
    font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; border: 1.5px solid var(--line-strong); background: transparent;
    color: var(--ink-dim); cursor: pointer;
  }
  .toggle.active.you { background: var(--you-bg); border-color: var(--you-bg); color: var(--ink); }
  .toggle.active.agent { background: var(--lane-color); border-color: var(--lane-color); color: #fff8f2; }
  textarea {
    width: 100%; min-height: 46px; max-height: 140px; resize: vertical;
    font-family: var(--sans); font-size: 13.5px; line-height: 1.5; padding: 8px 10px;
    border-radius: var(--radius); border: 1px solid var(--line-strong);
    background: var(--bg); color: var(--ink); outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea:disabled { opacity: 0.5; }
  .compose-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
  .compose-actions button { font-size: 12px; padding: 5px 10px; }

  .add-lane {
    flex: 0 0 64px; display: flex; align-items: flex-start; justify-content: center;
    padding-top: 14px;
  }
  .add-lane button {
    writing-mode: vertical-rl; padding: 12px 8px; font-size: 12px;
    color: var(--ink-dim); border-style: dashed;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 16px;
    border-radius: var(--radius); opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease; max-width: 80vw; text-align: center; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 20px; width: 320px; max-width: 100%;
  }
  .modal h2 { font-size: 14px; margin: 0 0 4px; }
  .modal .modal-desc { font-size: 12px; color: var(--ink-dim); margin-bottom: 14px; line-height: 1.5; }
  .modal label { font-size: 12px; color: var(--ink-dim); display: block; margin-bottom: 4px; margin-top: 10px; }
  .modal label:first-of-type { margin-top: 0; }
  .modal input[type=text], .modal input[type=password] {
    width: 100%; padding: 8px 10px; font-family: var(--sans); font-size: 14px;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--bg); color: var(--ink); font-family: var(--mono);
  }
  .color-row { display: flex; gap: 6px; margin: 4px 0 0; flex-wrap: wrap; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.selected { border-color: var(--ink); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal-error { font-size: 12px; color: var(--danger); margin-top: 8px; display: none; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Roundtable</h1>
    <div class="subtitle"><span class="dot" id="statusDot"></span><span id="statusText">not connected</span></div>
  </div>
  <div class="header-actions">
    <button id="syncBtn" class="icon" title="Sync now">↻</button>
    <button id="copyBtn" class="primary">Copy transcript</button>
    <button id="settingsBtn" class="icon" title="Settings">⚙</button>
  </div>
</header>

<div class="board" id="board"></div>

<div class="toast" id="toast">Copied</div>

<div class="modal-overlay" id="laneModal">
  <div class="modal">
    <h2>New lane</h2>
    <input type="text" id="newLaneName" placeholder="Name (e.g. Gemini)" maxlength="20">
    <div class="color-row" id="laneColorRow"></div>
    <div class="modal-actions">
      <button id="laneCancel">Cancel</button>
      <button id="laneAdd" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Connect this device</h2>
    <div class="modal-desc">Points this browser at the repo that stores the thread. A fine-grained GitHub token scoped to just this one repo, Contents: Read and write only. Stored in this browser's local storage — not synced anywhere.</div>
    <label>GitHub username / org</label>
    <input type="text" id="cfgOwner" placeholder="e.g. nolongerzzz">
    <label>Repo name</label>
    <input type="text" id="cfgRepo" placeholder="e.g. roundtable">
    <label>Branch</label>
    <input type="text" id="cfgBranch" placeholder="main">
    <label>File path</label>
    <input type="text" id="cfgPath" placeholder="thread.json">
    <label>Token</label>
    <input type="password" id="cfgToken" placeholder="github_pat_...">
    <div class="modal-error" id="cfgError"></div>
    <div class="modal-actions">
      <button id="cfgDisconnect" style="margin-right:auto;">Disconnect</button>
      <button id="cfgCancel">Cancel</button>
      <button id="cfgSave" class="primary">Save & sync</button>
    </div>
  </div>
</div>

<script>
(function() {
  const CONFIG_KEY = 'roundtable-config-v2';
  const CACHE_KEY = 'roundtable-cache-v2';
  const PALETTE = ['#b8532f', '#3a6b8a', '#6b5b95', '#4a7a4a', '#a13f6b', '#8a6b2f'];
  const API = 'https://api.github.com';

  let config = null;
  let sha = null;
  let pending = false;

  let state = {
    lanes: [
      { id: 'claude', name: 'Claude', color: PALETTE[0] },
      { id: 'grok', name: 'Grok', color: PALETTE[2] }
    ],
    toggles: { claude: 'you', grok: 'you' },
    messages: []
  };

  function loadConfig() {
    try { const raw = localStorage.getItem(CONFIG_KEY); if (raw) config = JSON.parse(raw); }
    catch (e) { console.warn(e); }
  }
  function saveConfig() {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) { console.warn(e); }
  }
  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.messages && parsed.lanes) state = parsed;
      }
    } catch (e) { console.warn(e); }
  }
  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) { console.warn(e); }
  }

  function b64Encode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
  }
  function b64Decode(str) {
    return decodeURIComponent(atob(str.replace(/\n/g, '')).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  }
  function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function laneById(id) { return state.lanes.find(l => l.id === id); }

  const board = document.getElementById('board');
  const copyBtn = document.getElementById('copyBtn');
  const syncBtn = document.getElementById('syncBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const toast = document.getElementById('toast');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const laneModal = document.getElementById('laneModal');
  const newLaneName = document.getElementById('newLaneName');
  const laneColorRow = document.getElementById('laneColorRow');
  const laneCancel = document.getElementById('laneCancel');
  const laneAdd = document.getElementById('laneAdd');

  const settingsModal = document.getElementById('settingsModal');
  const cfgOwner = document.getElementById('cfgOwner');
  const cfgRepo = document.getElementById('cfgRepo');
  const cfgBranch = document.getElementById('cfgBranch');
  const cfgPath = document.getElementById('cfgPath');
  const cfgToken = document.getElementById('cfgToken');
  const cfgError = document.getElementById('cfgError');
  const cfgSave = document.getElementById('cfgSave');
  const cfgCancel = document.getElementById('cfgCancel');
  const cfgDisconnect = document.getElementById('cfgDisconnect');

  let pickedColor = PALETTE[0];
  let composerEnabled = false;

  function setStatus(kind, text) {
    statusDot.className = 'dot' + (kind ? ' ' + kind : '');
    statusText.textContent = text;
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function render() {
    board.innerHTML = '';
    state.lanes.forEach(lane => { board.appendChild(buildLane(lane)); });
    const addWrap = document.createElement('div');
    addWrap.className = 'add-lane';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ add lane';
    addBtn.onclick = openLaneModal;
    addWrap.appendChild(addBtn);
    board.appendChild(addWrap);
  }

  function buildLane(lane) {
    const wrap = document.createElement('div');
    wrap.className = 'lane';
    wrap.style.setProperty('--lane-color', lane.color);

    const head = document.createElement('div');
    head.className = 'lane-head';
    head.innerHTML = `<span class="lane-dot"></span><span class="lane-name">${escapeHtml(lane.name)}</span>`;
    if (state.lanes.length > 1) {
      const rm = document.createElement('button');
      rm.className = 'bubble-action lane-remove';
      rm.textContent = 'remove';
      rm.onclick = () => {
        if (!confirm('Remove the ' + lane.name + ' lane? Its messages stay in the transcript.')) return;
        state.lanes = state.lanes.filter(l => l.id !== lane.id);
        saveCache(); render(); pushToGitHub();
      };
      head.appendChild(rm);
    }
    wrap.appendChild(head);

    const msgsEl = document.createElement('div');
    msgsEl.className = 'lane-messages';
    const laneMsgs = state.messages.filter(m => m.lane === lane.id);
    if (laneMsgs.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'lane-empty';
      empty.textContent = 'Nothing here yet. Ask ' + lane.name + ' something below.';
      msgsEl.appendChild(empty);
    } else {
      laneMsgs.forEach(m => msgsEl.appendChild(buildBubble(m, lane)));
    }
    wrap.appendChild(msgsEl);

    wrap.appendChild(buildComposer(lane));
    setTimeout(() => { msgsEl.scrollTop = msgsEl.scrollHeight; }, 0);
    return wrap;
  }

  function buildBubble(m, lane) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (m.from === 'you' ? 'you' : 'agent');

    const col = document.createElement('div');
    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    meta.textContent = (m.from === 'you' ? 'You' : lane.name) + ' · ' + fmtTime(m.ts);
    col.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;
    col.appendChild(bubble);

    const actions = document.createElement('div');
    actions.className = 'bubble-actions';
    const relay = document.createElement('button');
    relay.className = 'bubble-action';
    relay.textContent = '↗ relay';
    relay.onclick = () => relayMessage(m, lane);
    actions.appendChild(relay);
    const del = document.createElement('button');
    del.className = 'bubble-action';
    del.textContent = 'remove';
    del.onclick = () => {
      state.messages = state.messages.filter(x => x.id !== m.id);
      saveCache(); render(); pushToGitHub();
    };
    actions.appendChild(del);
    col.appendChild(actions);

    row.appendChild(col);
    return row;
  }

  function buildComposer(lane) {
    const wrap = document.createElement('div');
    wrap.className = 'lane-composer';

    const toggleRow = document.createElement('div');
    toggleRow.className = 'toggle-row';
    const youToggle = document.createElement('button');
    youToggle.className = 'toggle you' + (state.toggles[lane.id] === 'you' ? ' active' : '');
    youToggle.textContent = 'You';
    youToggle.onclick = () => { state.toggles[lane.id] = 'you'; saveCache(); render(); };
    const agentToggle = document.createElement('button');
    agentToggle.className = 'toggle agent' + (state.toggles[lane.id] === 'agent' ? ' active' : '');
    agentToggle.style.setProperty('--lane-color', lane.color);
    agentToggle.textContent = lane.name;
    agentToggle.onclick = () => { state.toggles[lane.id] = 'agent'; saveCache(); render(); };
    toggleRow.appendChild(youToggle);
    toggleRow.appendChild(agentToggle);
    wrap.appendChild(toggleRow);

    const ta = document.createElement('textarea');
    ta.placeholder = state.toggles[lane.id] === 'you'
      ? 'Type or paste what you\'re asking ' + lane.name + '...'
      : 'Paste ' + lane.name + '\'s reply...';
    ta.disabled = !composerEnabled;
    ta.dataset.laneId = lane.id;
    wrap.appendChild(ta);

    const actions = document.createElement('div');
    actions.className = 'compose-actions';
    const sendBtn = document.createElement('button');
    sendBtn.className = 'primary';
    sendBtn.textContent = 'Add';
    sendBtn.disabled = !composerEnabled;
    const send = () => {
      const text = ta.value.trim();
      if (!text) return;
      state.messages.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        lane: lane.id,
        from: state.toggles[lane.id],
        text: text,
        ts: Date.now()
      });
      ta.value = '';
      saveCache(); render(); pushToGitHub();
    };
    sendBtn.onclick = send;
    ta.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') send(); });
    actions.appendChild(sendBtn);
    wrap.appendChild(actions);

    return wrap;
  }

  function relayMessage(m, fromLane) {
    const others = state.lanes.filter(l => l.id !== fromLane.id);
    const text = m.text;
    const quoted = '> [' + (m.from === 'you' ? 'You → ' + fromLane.name : fromLane.name) + ']\n> ' + text.replace(/\n/g, '\n> ') + '\n\n';
    if (others.length === 1) {
      const target = others[0];
      state.toggles[target.id] = 'you';
      saveCache();
      render();
      const ta = board.querySelector('textarea[data-lane-id="' + target.id + '"]');
      if (ta) { ta.value = quoted; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      showToast('Dropped into ' + target.name + '\'s box — add your framing and send');
    } else {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copied — paste into the lane you want');
      }).catch(() => showToast('Copy failed — select manually'));
    }
  }

  function buildTranscript() {
    return state.messages
      .slice()
      .sort((a, b) => a.ts - b.ts)
      .map(m => {
        const lane = laneById(m.lane);
        const who = m.from === 'you' ? 'You (to ' + (lane ? lane.name : m.lane) + ')' : (lane ? lane.name : m.lane);
        return `[${who}]\n${m.text}`;
      }).join('\n\n');
  }

  async function copyTranscript() {
    if (state.messages.length === 0) { showToast('Nothing to copy yet'); return; }
    const text = buildTranscript();
    try {
      await navigator.clipboard.writeText(text);
      showToast('Transcript copied');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('Transcript copied'); }
      catch (e2) { showToast('Copy failed — select manually'); }
      document.body.removeChild(ta);
    }
  }

  function openLaneModal() {
    newLaneName.value = '';
    pickedColor = PALETTE[state.lanes.length % PALETTE.length];
    laneColorRow.innerHTML = '';
    PALETTE.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c === pickedColor ? ' selected' : '');
      sw.style.background = c;
      sw.onclick = () => {
        pickedColor = c;
        [...laneColorRow.children].forEach(ch => ch.classList.remove('selected'));
        sw.classList.add('selected');
      };
      laneColorRow.appendChild(sw);
    });
    laneModal.classList.add('show');
    newLaneName.focus();
  }
  laneCancel.onclick = () => laneModal.classList.remove('show');
  laneModal.onclick = (e) => { if (e.target === laneModal) laneModal.classList.remove('show'); };
  laneAdd.onclick = () => {
    const name = newLaneName.value.trim();
    if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 20) || ('lane-' + Date.now());
    if (state.lanes.some(l => l.id === id)) { showToast('Already have that lane'); return; }
    state.lanes.push({ id, name, color: pickedColor });
    state.toggles[id] = 'you';
    saveCache(); render(); laneModal.classList.remove('show'); pushToGitHub();
  };
  newLaneName.addEventListener('keydown', (e) => { if (e.key === 'Enter') laneAdd.click(); });

  function openSettingsModal() {
    cfgError.style.display = 'none';
    cfgOwner.value = config ? config.owner : '';
    cfgRepo.value = config ? config.repo : '';
    cfgBranch.value = config ? config.branch : 'main';
    cfgPath.value = config ? config.path : 'thread.json';
    cfgToken.value = config ? config.token : '';
    settingsModal.classList.add('show');
  }
  settingsBtn.onclick = openSettingsModal;
  cfgCancel.onclick = () => settingsModal.classList.remove('show');
  settingsModal.onclick = (e) => { if (e.target === settingsModal) settingsModal.classList.remove('show'); };
  cfgDisconnect.onclick = () => {
    config = null;
    localStorage.removeItem(CONFIG_KEY);
    settingsModal.classList.remove('show');
    composerEnabled = false;
    render();
    setStatus('', 'not connected');
    showToast('Disconnected');
  };
  cfgSave.onclick = async () => {
    const owner = cfgOwner.value.trim();
    const repo = cfgRepo.value.trim();
    const branch = cfgBranch.value.trim() || 'main';
    const path = cfgPath.value.trim() || 'thread.json';
    const token = cfgToken.value.trim();
    if (!owner || !repo || !token) {
      cfgError.textContent = 'Username, repo, and token are all required.';
      cfgError.style.display = 'block';
      return;
    }
    config = { owner, repo, branch, path, token };
    saveConfig();
    settingsModal.classList.remove('show');
    await pullFromGitHub(true);
  };

  function ghHeaders() {
    return {
      'Authorization': 'Bearer ' + config.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  function fileUrl() {
    return `${API}/repos/${config.owner}/${config.repo}/contents/${encodeURIComponent(config.path)}?ref=${encodeURIComponent(config.branch)}`;
  }

  async function pullFromGitHub(isInitialConnect) {
    if (!config) return;
    setStatus('busy', 'syncing…');
    try {
      const res = await fetch(fileUrl(), { headers: ghHeaders() });
      if (res.status === 404) {
        sha = null;
        composerEnabled = true;
        render();
        if (isInitialConnect) await pushToGitHub();
        setStatus('synced', 'connected · new file');
        return;
      }
      if (res.status === 401 || res.status === 403) {
        setStatus('error', 'auth failed — check token/scope');
        showToast('GitHub rejected the token');
        composerEnabled = false; render();
        return;
      }
      if (!res.ok) { setStatus('error', 'sync failed (' + res.status + ')'); return; }
      const data = await res.json();
      sha = data.sha;
      const remote = JSON.parse(b64Decode(data.content));
      if (remote && Array.isArray(remote.messages) && Array.isArray(remote.lanes)) {
        state.lanes = remote.lanes;
        state.messages = remote.messages;
        state.toggles = remote.toggles || state.toggles;
      }
      composerEnabled = true;
      saveCache();
      render();
      setStatus('synced', config.owner + '/' + config.repo + ' · synced ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
    } catch (e) {
      console.warn(e);
      setStatus('error', 'network error');
    }
  }

  async function pushToGitHub() {
    if (!config || pending) return;
    pending = true;
    setStatus('busy', 'saving…');
    try {
      const payload = { lanes: state.lanes, toggles: state.toggles, messages: state.messages };
      const body = {
        message: 'Update roundtable thread',
        content: b64Encode(JSON.stringify(payload, null, 2)),
        branch: config.branch
      };
      if (sha) body.sha = sha;
      let res = await fetch(fileUrl().split('?')[0], {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders()),
        body: JSON.stringify(body)
      });
      if (res.status === 409) {
        const fresh = await fetch(fileUrl(), { headers: ghHeaders() });
        if (fresh.ok) {
          const data = await fresh.json();
          sha = data.sha;
          const remote = JSON.parse(b64Decode(data.content));
          const existingIds = new Set((remote.messages || []).map(m => m.id));
          state.messages = (remote.messages || []).concat(state.messages.filter(m => !existingIds.has(m.id)));
          if (Array.isArray(remote.lanes)) {
            const ids = new Set(remote.lanes.map(l => l.id));
            state.lanes = remote.lanes.concat(state.lanes.filter(l => !ids.has(l.id)));
          }
          saveCache(); render();
          const retryBody = {
            message: 'Update roundtable thread',
            content: b64Encode(JSON.stringify({ lanes: state.lanes, toggles: state.toggles, messages: state.messages }, null, 2)),
            branch: config.branch,
            sha: sha
          };
          res = await fetch(fileUrl().split('?')[0], {
            method: 'PUT',
            headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders()),
            body: JSON.stringify(retryBody)
          });
        }
      }
      if (!res.ok) { setStatus('error', 'save failed (' + res.status + ') — local copy kept'); pending = false; return; }
      const result = await res.json();
      sha = result.content.sha;
      setStatus('synced', config.owner + '/' + config.repo + ' · synced ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
    } catch (e) {
      console.warn(e);
      setStatus('error', 'network error — local copy kept');
    }
    pending = false;
  }

  syncBtn.onclick = () => pullFromGitHub(false);
  copyBtn.onclick = copyTranscript;

  loadCache();
  loadConfig();
  render();
  if (config) {
    pullFromGitHub(false);
  } else {
    composerEnabled = false;
    render();
    setStatus('', 'not connected — open settings ⚙');
  }
})();
</script>

</body>
</html>
